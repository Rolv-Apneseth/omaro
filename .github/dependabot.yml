version: 2

updates:
  - package-ecosystem: cargo
    directory: /
    open-pull-requests-limit: 5
    schedule:
      interval: weekly
      day: friday
    allow:
      - dependency-type: all
    cooldown:
      default-days: 7
    groups:
      patch-updates:
        patterns:
          - "*"
        update-types:
          - "patch"
      minor-updates:
        patterns:
          - "*"
        update-types:
          - "minor"
      major-updates:
        patterns:
          - "*"
        update-types:
          - "major"

  - package-ecosystem: github-actions
    directory: /
    open-pull-requests-limit: 3
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions-updates:
        patterns:
          - "*"
